<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR English Eat - Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; }
        #output-canvas { width: 100vw; height: 100vh; object-fit: cover; }
        .hidden { display: none !important; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pulse-red { animation: pulse-red 1.5s infinite; }
    </style>
</head>
<body>

    <div class="relative w-full h-full">
        <canvas id="output-canvas"></canvas>
        <video id="input-video" class="hidden" playsinline muted></video>

        <div id="ui-layer" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-4">
            <div id="hud" class="hidden bg-black/70 backdrop-blur-md rounded-2xl p-4 text-center border border-white/20 pointer-events-auto">
                <div class="flex justify-between mb-1 text-[10px] text-purple-300">
                    <span id="player-info">Player: Guest</span>
                    <span id="score-text" class="text-green-400 font-bold text-lg">Score: 0</span>
                </div>
                <div class="flex justify-center items-center gap-3">
                    <div id="question-text" class="text-yellow-400 text-xl font-bold">Loading...</div>
                    <button onclick="speakText(document.getElementById('question-text').innerText)" class="bg-white/20 rounded-full w-8 h-8 flex items-center justify-center">🔊</button>
                </div>
            </div>
            <div id="toast" class="hidden self-center bg-red-600 px-6 py-2 rounded-full font-bold shadow-xl"></div>
        </div>

        <div id="screen-login" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center p-6">
            <div class="bg-slate-800 p-8 rounded-3xl border border-purple-500 shadow-2xl w-full max-w-sm">
                <h1 class="text-3xl font-bold text-center mb-6 bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">AR English Eat</h1>
                <input id="input-name" type="text" placeholder="ชื่อเล่น (Nickname)" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 mb-4 text-white outline-none focus:border-purple-500">
                <button onclick="initApp()" class="w-full bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold transition-all">เริ่มเกม</button>
            </div>
        </div>

        <div id="screen-speech" class="hidden absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-slate-800 p-8 rounded-3xl border-2 border-yellow-500 max-w-xs w-full">
                <p class="text-purple-400 text-sm mb-1">พูดคำนี้ให้ถูกต้อง!</p>
                <div id="speech-target" class="text-4xl font-bold text-white mb-2 uppercase">WORD</div>
                <div id="speech-hint" class="text-2xl text-green-400 font-bold mb-6">คำอ่าน</div>
                <button id="mic-button" onclick="handleSpeech()" class="w-20 h-20 bg-purple-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">🎙️</button>
                <p id="speech-status" class="text-xs text-slate-400 mb-4">กดปุ่มไมค์แล้วพูด</p>
                <button onclick="closeSpeech()" class="text-slate-500 underline text-xs">ข้าม</button>
            </div>
        </div>

        <div id="screen-end" class="hidden absolute inset-0 z-50 bg-slate-900/95 flex flex-col items-center justify-center text-center">
            <h2 class="text-3xl font-bold mb-2">จบเกม!</h2>
            <div id="final-score" class="text-6xl font-bold text-green-400 mb-8">0</div>
            <button onclick="location.reload()" class="bg-white text-black px-10 py-3 rounded-xl font-bold">เล่นใหม่</button>
        </div>
