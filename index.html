<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR English Eat - Improved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body { overscroll-behavior: none; background-color: #1a202c; overflow: hidden; }
        /* กลับด้านวิดีโอและแคนวาสเพื่อให้เหมือนกระจก */
        #container-wrapper { transform: scaleX(-1); position: relative; width: 100%; height: 100%; }
        canvas { width: 100%; height: 100%; object-fit: cover; }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .pulse-red { animation: pulse-red 1.5s infinite; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="h-screen w-screen text-white select-none">

    <div id="game-container" class="relative w-full h-full bg-gray-900 overflow-hidden">
        
        <div id="container-wrapper">
            <video id="input-video" class="hidden" playsinline muted></video>
            <canvas id="output-canvas"></canvas>
        </div>

        <div id="ui-layer" class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between p-4">
            <div id="hud" class="hidden bg-black/60 backdrop-blur-md rounded-2xl p-4 text-center border border-white/20 pointer-events-auto">
                <div class="flex justify-between mb-2 text-xs text-purple-300">
                    <span id="display-info">Player: Guest</span>
                    <span id="score-text" class="text-green-400 font-bold text-lg">Score: 0</span>
                </div>
                <div class="flex justify-center items-center gap-3">
                    <div id="question-text" class="text-yellow-400 text-xl font-bold">Loading...</div>
                    <button onclick="speakText(document.getElementById('question-text').innerText)" class="bg-white/20 rounded-full w-10 h-10 flex items-center justify-center">🔊</button>
                </div>
            </div>
            
            <div id="toast" class="hidden self-center bg-red-500 px-6 py-2 rounded-full font-bold shadow-2xl"></div>
        </div>

        <div id="screen-login" class="absolute inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center p-6">
            <div class="w-full max-w-md bg-gray-800 p-8 rounded-3xl border border-purple-500/50 shadow-2xl">
                <h1 class="text-4xl font-bold text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">AR English Eat</h1>
                <p class="text-center text-gray-400 mb-8 italic">Catch the correct word with your mouth!</p>
                <input id="input-name" type="text" placeholder="Nickname" class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 mb-4 outline-none focus:border-purple-500">
                <button onclick="startApp()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 py-3 rounded-xl font-bold text-xl hover:scale-105 transition-transform">START GAME</button>
            </div>
        </div>

        <div id="screen-speech" class="hidden absolute inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-6 text-center">
            <div class="bg-gray-800 p-8 rounded-3xl border border-yellow-500/50 max-w-sm w-full">
                <h2 class="text-xl text-purple-400 mb-2">Speak it! 🎤</h2>
                <div id="speech-target" class="text-5xl font-bold text-white mb-4 uppercase">WORD</div>
                <div id="speech-hint-th" class="text-2xl text-green-400 mb-1 font-bold">คำอ่าน</div>
                <div id="speech-status" class="text-sm text-gray-400 mb-6">Press the mic and speak</div>
                
                <button id="mic-button" onclick="handleSpeech()" class="w-20 h-20 bg-purple-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg">🎙️</button>
                
                <div class="flex flex-col gap-2">
                    <button onclick="speakText(document.getElementById('speech-target').innerText)" class="text-sm text-gray-300">🔊 Listen again</button>
                    <button onclick="closeSpeech()" class="text-xs text-gray-500 underline">Skip Round</button>
                </div>
            </div>
        </div>

        <div id="screen-end" class="hidden absolute inset-0 z-50 bg-gray-900/90 flex flex-col items-center justify-center p-6 text-center">
            <h2 class="text-4xl font-bold mb-2">Game Over!</h2>
            <div class="text-7xl font-bold text-green-400 mb-8" id="final-score">0</div>
            <button onclick="location.reload()" class="bg-white text-black px-10 py-3 rounded-xl font-bold text-lg">Play Again</button>
        </div>
    </div>

<script>
// --- Configuration ---
const CONFIG = {
    mouthThreshold: 0.045,
    gravity: 3.5,
    spawnRate: 90, // ปรับให้หล่นเร็วขึ้นเล็กน้อย
    totalQuestions: 10
};

const QUESTIONS_DB = [
    { q: "Past tense of 'Go'?", list: ["Went", "Gone", "Goes"], correct: "Went", th: "เวนท์" },
    { q: "Past tense of 'Buy'?", list: ["Bought", "Buyed", "Bring"], correct: "Bought", th: "บอท" },
    { q: "Opposite of 'Expensive'?", list: ["Cheap", "Rich", "Small"], correct: "Cheap", th: "ชีพ" },
    { q: "A place to borrow books?", list: ["Library", "Market", "Zoo"], correct: "Library", th: "ไล-เบร-รี" },
    { q: "Who works in a hospital?", list: ["Doctor", "Pilot", "Chef"], correct: "Doctor", th: "ดอค-เทอร์" },
    { q: "The capital of Thailand?", list: ["Bangkok", "London", "Tokyo"], correct: "Bangkok", th: "แบง-ค็อก" },
    { q: "Opposite of 'Dangerous'?", list: ["Safe", "Scary", "Hard"], correct: "Safe", th: "เซฟ" },
    { q: "Subject about numbers?", list: ["Math", "Art", "Thai"], correct: "Math", th: "แมธ" },
    { q: "What is H2O?", list: ["Water", "Fire", "Air"], correct: "Water", th: "วอ-เทอร์" }
];

// --- Game State ---
let state = {
    isPlaying: false,
    score: 0,
    qIndex: 0,
    items: [],
    mouth: { x: 0, y: 0, isOpen: false },
    currentQ: null,
    canvasSize: { w: 0, h: 0 }
};

let faceMesh;
const video = document.getElementById('input-video');
const canvas = document.getElementById('output-canvas');
const ctx = canvas.getContext('2d');

// --- Core Logic ---
async function startApp() {
    const name = document.getElementById('input-name').value || "Guest";
    document.getElementById('display-info').innerText = `Player: ${name}`;
    document.getElementById('screen-login').classList.add('hidden');
    
    // Init FaceMesh
    faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
    faceMesh.onResults(onResults);

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
        video.srcObject = stream;
        await video.play();
        resize();
        requestAnimationFrame(gameLoop);
        startGame();
    } catch (err) {
        alert("Camera access denied or not found.");
    }
}

function resize() {
    state.canvasSize.w = window.innerWidth;
    state.canvasSize.h = window.innerHeight;
    canvas.width = state.canvasSize.w;
    canvas.height = state.canvasSize.h;
}

window.addEventListener('resize', resize);

function onResults(results) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw Video Frame
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks?.[0]) {
        const landmarks = results.multiFaceLandmarks[0];
        // 13 = Upper Lip Bottom, 14 = Lower Lip Top
        const topLip = landmarks[13];
        const botLip = landmarks[14];
        
        state.mouth.x = topLip.x * canvas.width;
        state.mouth.y = (topLip.y + botLip.y) / 2 * canvas.height;
        
        const mouthGap = Math.abs(topLip.y - botLip.y);
        state.mouth.isOpen = mouthGap > CONFIG.mouthThreshold;

        // Visual Feedback (Circle at mouth)
        ctx.beginPath();
        ctx.arc(state.mouth.x, state.mouth.y, 20, 0, Math.PI * 2);
        ctx.strokeStyle = state.mouth.isOpen ? "#00ff00" : "#ff3333";
        ctx.lineWidth = 3;
        ctx.stroke();
    }
}

function startGame() {
    state.score = 0;
    state.qIndex = 0;
    state.items = [];
    state.isPlaying = true;
    document.getElementById('hud').classList.remove('hidden');
    loadNextQuestion();
}

function loadNextQuestion() {
    if (state.qIndex >= CONFIG.totalQuestions) return endGame();
    state.currentQ = QUESTIONS_DB[Math.floor(Math.random() * QUESTIONS_DB.length)];
    document.getElementById('question-text').innerText = state.currentQ.q;
    speakText(state.currentQ.q);
}

let frameCount = 0;
function gameLoop() {
    if (video.readyState === 4) {
        faceMesh.send({ image: video });
    }

    if (state.isPlaying) {
        frameCount++;
        
        // Spawn Items
        if (frameCount % CONFIG.spawnRate === 0) {
            const isCorrect = Math.random() > 0.5;
            const text = isCorrect ? state.currentQ.correct : state.currentQ.list.filter(w => w !== state.currentQ.correct)[Math.floor(Math.random() * 2)];
            state.items.push({
                x: 50 + Math.random() * (canvas.width - 100),
                y: -50,
                text: text,
                isCorrect: isCorrect
            });
        }

        // Update & Draw Items
        for (let i = state.items.length - 1; i >= 0; i--) {
            let item = state.items[i];
            item.y += CONFIG.gravity;

            // Draw Word (Flip text back so it's readable)
            ctx.save();
            ctx.translate(item.x, item.y);
            ctx.scale(-1, 1); // Flip text back
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillStyle = "white";
            // Shadow
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            ctx.fillText(item.text, 0, 0);
            ctx.restore();

            // Collision Detection
            const dist = Math.sqrt((state.mouth.x - item.x)**2 + (state.mouth.y - item.y)**2);
            if (state.mouth.isOpen && dist < 60) {
                if (item.isCorrect) {
                    state.score += 10;
                    state.isPlaying = false;
                    setTimeout(() => triggerSpeechBonus(item.text), 300);
                } else {
                    state.score = Math.max(0, state.score - 5);
                    showToast("Wrong! -5");
                }
                state.items.splice(i, 1);
            } else if (item.y > canvas.height + 50) {
                state.items.splice(i, 1);
            }
        }
    }
    
    document.getElementById('score-text').innerText = `Score: ${state.score}`;
    requestAnimationFrame(gameLoop);
}

// --- Features ---
function triggerSpeechBonus(word) {
    const screen = document.getElementById('screen-speech');
    screen.classList.remove('hidden');
    document.getElementById('speech-target').innerText = word;
    document.getElementById('speech-hint-th').innerText = state.currentQ.th;
    document.getElementById('speech-status').innerText = "Click mic and speak";
    document.getElementById('mic-button').className = "w-20 h-20 bg-purple-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg";
}

function handleSpeech() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Speech not supported");

    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    const btn = document.getElementById('mic-button');

    recognition.onstart = () => {
        btn.classList.add('pulse-red', 'bg-red-500');
        document.getElementById('speech-status').innerText = "Listening...";
    };

    recognition.onresult = (e) => {
        const result = e.results[0][0].transcript.toLowerCase();
        const target = document.getElementById('speech-target').innerText.toLowerCase();
        
        if (result.includes(target)) {
            state.score += 20;
            btn.className = "w-20 h-20 bg-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6";
            document.getElementById('speech-status').innerText = "Excellent! +20";
            setTimeout(closeSpeech, 1500);
        } else {
            document.getElementById('speech-status').innerText = `Heard "${result}", try again!`;
            btn.classList.remove('pulse-red', 'bg-red-500');
        }
    };

    recognition.onerror = () => {
        btn.classList.remove('pulse-red');
        document.getElementById('speech-status').innerText = "Try again...";
    };

    recognition.start();
}

function closeSpeech() {
    document.getElementById('screen-speech').classList.add('hidden');
    state.qIndex++;
    state.items = [];
    state.isPlaying = true;
    loadNextQuestion();
}

function speakText(txt) {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.remove('hidden');
    setTimeout(() => t.classList.add('hidden'), 2000);
}

function endGame() {
    state.isPlaying = false;
    document.getElementById('screen-end').classList.remove('hidden');
    document.getElementById('final-score').innerText = state.score;
}
</script>
</body>
</html>
